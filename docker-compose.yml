services:
  comfyui:
    image: ghcr.io/clems4ever/mycomfyui:latest
    # To build from source instead, replace the line above with: build: .
    ports:
      - "8188:8188"
    environment:
      # For gated Hugging Face / Civitai models; set them in a .env file next to this one
      HF_TOKEN: ${HF_TOKEN:-}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
      # Unload models from VRAM after this many idle minutes; 0 keeps them loaded
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-3}
    volumes:
      - ./data/models:/opt/ComfyUI/models
      - ./data/custom_nodes:/opt/ComfyUI/custom_nodes
      - ./data/input:/opt/ComfyUI/input
      - ./data/output:/opt/ComfyUI/output
      - ./data/user:/opt/ComfyUI/user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
